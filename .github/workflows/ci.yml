name: CI

on:
  push:
    branches: [main, integration/epic77-progress]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-audit:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - run: node tools/typst-runtime.mjs install
      - run: node tools/typst-runtime.mjs verify --compile
      - name: Verify Windows artifact publication protocol
        if: runner.os == 'Windows'
        run: node --test tools/artifact-publication.test.mjs
      - run: npm test
      - name: Verify release signatures with ephemeral test keys
        run: node --test tools/release-signing.test.mjs
      - run: npm run test:acceptance
      - name: Verify release staging
        run: node tools/build-release.mjs --stage-only
      - name: Audit staged public tree for fork pull requests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: npm run release:audit -- --root dist/release/stage --stage
      - name: Audit staged public tree with required private markers
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: npm run release:audit -- --root dist/release/stage --stage --require-markers
        env:
          SCOUT_RELEASE_MARKERS: ${{ secrets.SCOUT_RELEASE_MARKERS }}
      - name: Install native Windows packager
        if: runner.os == 'Windows'
        run: choco install innosetup --yes --no-progress
      - name: Exercise native Windows packaging
        if: runner.os == 'Windows'
        run: node tools/build-release.mjs --installer
        env:
          SCOUT_RELEASE_MARKERS: SyntheticCiPackagingMarker
      - name: Exercise native macOS packaging
        if: runner.os == 'macOS'
        run: node tools/build-platform.mjs mac
        env:
          SCOUT_RELEASE_MARKERS: SyntheticCiPackagingMarker
      - name: Exercise native Linux packaging
        if: runner.os == 'Linux'
        run: node tools/build-platform.mjs linux
        env:
          SCOUT_RELEASE_MARKERS: SyntheticCiPackagingMarker

  browser-acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15, macos-15-intel]
        browser: [chromium, firefox, webkit]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node tools/typst-runtime.mjs install
      - run: node tools/typst-runtime.mjs verify --compile
      - name: Install requested browser with native dependencies
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:browser -- --project=${{ matrix.browser }}

  windows-native:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: node tools/typst-runtime.mjs install
      - name: Compile production C# host and execute native receipts plus long-path measurement
        run: node --test tools/windows-native.test.mjs

  installed-artifact:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: node tools/typst-runtime.mjs install
      - run: npx playwright install --with-deps chromium
      - name: Install native Windows packager
        if: runner.os == 'Windows'
        run: choco install innosetup --yes --no-progress
      - name: Build Windows artifact
        if: runner.os == 'Windows'
        run: node tools/build-release.mjs --installer
        env: { SCOUT_RELEASE_MARKERS: SyntheticNativeAcceptanceMarker }
      - name: Build macOS artifact and compile native Swift launcher
        if: runner.os == 'macOS'
        run: node tools/build-platform.mjs mac
        env: { SCOUT_RELEASE_MARKERS: SyntheticNativeAcceptanceMarker }
      - name: Build Linux artifacts
        if: runner.os == 'Linux'
        run: node tools/build-platform.mjs linux
        env: { SCOUT_RELEASE_MARKERS: SyntheticNativeAcceptanceMarker }
      - name: Install artifact, first launch, onboard, choose mode, scan, show results, uninstall
        run: node tools/native-install-smoke.mjs
      - name: Install and exercise Linux portable artifact independently
        if: runner.os == 'Linux'
        run: node tools/native-install-smoke.mjs --portable
